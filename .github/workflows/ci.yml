name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Home Assistant 2026.8+ requires Python 3.14.
  PYTHON_VERSION: "3.14"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      component: ${{ steps.filter.outputs.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            component:
              - 'custom_components/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'requirements_test.txt'
              - '.pre-commit-config.yaml'
              - 'hacs.json'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Installs Home Assistant too: mypy needs its types to resolve base classes.
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: mypy
      - name: Manifest pin matches requirements_test.txt
        run: |
          manifest=$(jq -r '.requirements[] | select(startswith("united-utilities"))' custom_components/united_utilities/manifest.json)
          grep -qxF "$manifest" requirements_test.txt || { echo "::error::manifest requires $manifest but requirements_test.txt disagrees"; exit 1; }
      - name: translations/en.json matches strings.json
        run: cmp custom_components/united_utilities/strings.json custom_components/united_utilities/translations/en.json
      # Dependabot bumps the pre-commit rev and requirements_test.txt in separate PRs.
      - name: ruff pin agrees between pre-commit and requirements_test.txt
        run: |
          hook=$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//')
          req=$(grep -oE '^ruff==[0-9.]+' requirements_test.txt | cut -d= -f3)
          [ "$hook" = "$req" ] || { echo "::error::ruff is $hook in .pre-commit-config.yaml but $req in requirements_test.txt"; exit 1; }
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - run: pytest --cov=custom_components.united_utilities --cov-report=term-missing

  # hacs.json declares 2026.8.0 as the minimum; prove it still works there.
  test-floor:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements_test.txt "pytest-homeassistant-custom-component==0.13.354"
      - name: Assert the floor pairing is what installed
        run: python -c "from homeassistant.const import __version__ as v; assert v.startswith('2026.8.'), v; print('Home Assistant', v)"
      - run: pytest

  hacs_validate:
    needs: changes
    if: needs.changes.outputs.component == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master
      - name: Build the HACS release asset
        run: bash scripts/package-hacs-zip.sh

  # Aggregate gate. The jobs above are path-filtered, so a docs-only change skips
  # them; requiring any one of them would leave the check pending forever. This
  # job always runs and is the single check branch protection requires.
  ci:
    name: ci
    if: always()
    needs: [changes, lint, test, test-floor, hacs_validate]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          if [ "${{ needs.changes.outputs.component }}" != "true" ]; then
            echo "No component changes; nothing to gate."
            exit 0
          fi
          for result in \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}" \
            "test-floor=${{ needs['test-floor'].result }}" \
            "hacs_validate=${{ needs.hacs_validate.result }}"
          do
            name="${result%%=*}"
            status="${result##*=}"
            if [ "$status" != "success" ]; then
              echo "::error::$name did not succeed ($status)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
